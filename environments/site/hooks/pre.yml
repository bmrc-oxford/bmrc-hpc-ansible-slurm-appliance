- hosts: builder
  gather_facts: no
  become: yes
  tags: ondemand
  tasks:
    - name: Enable upstream ondemand repos
      # Required because these are not in Ark
      # Can be removed once https://github.com/stackhpc/ansible-slurm-appliance/pull/832 in use
      community.general.ini_file:
       path: /etc/yum.repos.d/ondemand-web.repo
       section: ondemand-web
       option: enabled
       value: 1

# Modified from ansible/iam.yml
- hosts: freeipa_client:!builder
  gather_facts: no
  become: yes
  tags: freeipa
  vars: # replicating freeipa role defaults
    freeipa_client_ip: "{{ ansible_host }}"
  tasks:
    # Modified from ansible/roles/freeipa/tasks/addhost.yml
    - name: Get ipa host information
      # This uses DNS to find the ipa server, which works as this is running on the enrolled ipa server
      # It doesn't fail even if the host doesn't exist
      community.general.ipa_host:
        name: "{{ node_fqdn }}"
        ip_address: "{{ freeipa_client_ip }}"
        ipa_pass: "{{ vault_freeipa_admin_password }}"
        ipa_user: "{{ freeipa_admin_user }}"
        state: present
        validate_certs: false
      delegate_to: "{{ groups['nvs_freeipa_server'].0 }}"
      register: _ipa_host_check
      check_mode: yes
      changed_when: false

    - name: Add host to IPA
      # Using random_password=true this unenroles an enroled host, hence the check above
      community.general.ipa_host:
        name: "{{ node_fqdn }}"
        ip_address: "{{ freeipa_client_ip }}"
        ipa_pass: "{{ vault_freeipa_admin_password }}"
        ipa_user: "{{ freeipa_admin_user }}"
        random_password: true
        state: present
        validate_certs: false
        ipa_timeout: 30
      delegate_to: "{{ groups['nvs_freeipa_server'].0 }}"
      when: "'sshpubkeyfp' not in _ipa_host_check.host"
      register: _ipa_host_add

    - name: Set fact for ipa host password
      set_fact:
        freeipa_host_password: "{{ _ipa_host_add.host.randompassword }}"
      when: _ipa_host_add.changed
