openhpc_nodegroups:
  - name: general # m3.large.cascadelake
    features: ["cascadelake"]
  - name: general-100disk # m3.large.100disk
    features: ["icelake"]
  - name: general_skylake # m3.large.skylake
    features: ["skylake"]
  - name: legacy  # m3.medium
    features: ["skylake"]
  - name: a100
    features: ["cascadelake"]
    gres_autodetect: nvidia # can't use nvml b/c disabling slurm package recompile for speed
    gres:
      - conf: "gpu:A100:3"
  - name: ood # m3.large.100disk
  - name: v100
    features: ["cascadelake"]
    gres_autodetect: nvidia
    gres:
      - conf: "gpu:V100:1"
  - name: v100-full
    features: ["cascadelake"]
    gres_autodetect: nvidia
    gres:
      - conf: "gpu:V100:3"

openhpc_partitions:
  # TODO: add maxtime, partition_params etc here
  # See https://github.com/stackhpc/ansible-role-openhpc/README.md
  - name: general
    nodegroups:
      - general
      - general-100disk
      - general_skylake
    default: 'YES'
  - name: legacy
    default: 'NO'
  - name: a100
    default: 'NO'
  - name: ood
    default: 'NO'
    maxtime: '5-0' # 5 days
    partition_params:
      DefMemPerNode: 7600
      MaxMemPerNode: 30400
  - name: v100
    default: 'NO'
  - name: v100-full
    default: 'NO'

openhpc_config_extra:
  GresTypes:
    - gpu
  MaxArraySize: 100000
  MaxJobCount: 100000
  AccountingStorageEnforce: # same as BMRC
    - associations
    - limits
    - qos
    - safe
  AccountingStorageTRES: # same as BMRC
    - cpu
    - mem
    - energy
    - node
    - billing
    - fs/disk
    - vmem
    - pages
    - gres/gpu
    - gres/gpumem
    - gres/gpuutil
  PriorityWeightFairShare: 10000000
  PriorityWeightAge: 1000000
